<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Master Download Manager</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="ytd-header">
    <span class="ytd-brand">Master Download Manager</span>
    <span id="ytd-conn-dot" class="ytd-dot"></span>
  </header>
  <div id="ytd-conn-text" class="ytd-conn-text">Checking connection…</div>

  <div class="ytd-section">
    <div class="ytd-group-label">THIS SITE</div>
    <div id="ytd-site-name" class="ytd-site-name">—</div>
    <div id="ytd-site-status" class="ytd-site-status"></div>
    <button id="ytd-toggle-block" type="button" class="ytd-link-btn" hidden></button>
    <button id="ytd-send-page" type="button" class="ytd-send-btn" hidden>⬇ Send this page to Master Download Manager</button>
    <div id="ytd-send-status" class="ytd-site-status"></div>
  </div>

  <div class="ytd-section">
    <div class="ytd-group-label">RECENT</div>
    <div id="ytd-recent-list" class="ytd-recent-list"></div>
  </div>

  <footer class="ytd-footer">
    <button id="ytd-open-settings" type="button">Settings</button>
    <button id="ytd-retry" type="button">Test Connection</button>
  </footer>

  <script src="ytd-client.js"></script>
  <script src="popup.js"></script>
</body>
</html>
